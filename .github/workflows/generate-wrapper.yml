name: Generate Gradle Wrapper

on:
  workflow_dispatch: # Mengizinkan eksekusi manual

permissions:
  contents: write # Memberikan izin pada GitHub untuk menyimpan file ke repo

jobs:
  create-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Commit and Push Wrapper Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/
          git commit -m "chore: otomatis menambahkan file gradle wrapper" || echo "Tidak ada perubahan"
          git push