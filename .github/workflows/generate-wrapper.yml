name: Generate Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper (isolated)
        run: |
          # Create wrapper in /tmp with minimal Gradle project
          mkdir -p /tmp/wrapper_gen
          cd /tmp/wrapper_gen
          
          # Create minimal settings.gradle for wrapper generation
          echo 'rootProject.name = "temp"' > settings.gradle
          
          # Generate wrapper
          gradle wrapper --gradle-version 8.4
          
          # Copy generated files to repo
          cp gradlew $GITHUB_WORKSPACE/
          cp gradlew.bat $GITHUB_WORKSPACE/
          cp -r gradle $GITHUB_WORKSPACE/
          
          # Cleanup
          cd $GITHUB_WORKSPACE
          rm -rf /tmp/wrapper_gen

      - name: Commit and Push Wrapper Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/
          git commit -m "chore: otomatis menambahkan file gradle wrapper" || echo "Tidak ada perubahan"
          git push