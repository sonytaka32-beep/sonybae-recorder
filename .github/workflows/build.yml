name: Build SONYBAE Recorder APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # Update ke v4
    - uses: actions/checkout@v4 
    
    # Update ke v4
    - name: set up JDK 17
      uses: actions/setup-java@v4 
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      
    # Update utama ke v4 untuk mengatasi error
    - name: Upload APK
      uses: actions/upload-artifact@v4 
      with:
        name: SONYBAE-Recorder-App
        path: app/build/outputs/apk/debug/app-debug.apk